<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Agent Gateway</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' text-anchor='middle' fill='white'%3EG%3C/text%3E%3C/svg%3E">
<!-- 样式与脚本外置，配合严格 CSP（script-src 'self'; style-src 'self'）。 -->
<link rel="stylesheet" href="/assets/login.css">
</head>
<body>
<form method="post" action="/login">
  <h1>登录 Agent Gateway</h1>
  <p class="error" id="error"></p>
  <label for="username">用户名</label>
  <input id="username" name="username" autocomplete="username" required autofocus>
  <label for="password">密码</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <input type="hidden" name="next" id="next" value="/">
  <button type="submit">登录</button>
</form>
<script src="/assets/login.js"></script>
</body>
</html>
